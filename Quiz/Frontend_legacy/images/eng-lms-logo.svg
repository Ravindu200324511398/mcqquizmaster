<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 84" width="220" height="58">
  <defs>
    <linearGradient id="lmsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Cyan Banner Card -->
  <rect x="2" y="2" width="316" height="80" rx="10" fill="url(#lmsGrad)" filter="url(#shadow)" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Left Text: ENG -->
  <text x="32" y="52" fill="#ffffff" font-family="'Segoe UI', Roboto, -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="1">ENG</text>

  <!-- Center Circle Crest -->
  <g transform="translate(160, 42)">
    <!-- Outer dashed circle -->
    <circle r="32" fill="#0369a1" stroke="#ffffff" stroke-width="2" stroke-dasharray="4,2"/>
    <circle r="27" fill="#0284c7" stroke="#ffffff" stroke-width="1.5"/>
    
    <!-- Traditional Lamp (පහන) / Flame of Wisdom -->
    <!-- Base -->
    <path d="M -12 15 Q 0 17 12 15 L 8 10 Q 0 11 -8 10 Z" fill="#ffffff"/>
    <path d="M -3 10 L -3 2 L 3 2 L 3 10 Z" fill="#ffffff"/>
    <!-- Lamp Bowl -->
    <path d="M -16 2 Q -18 -6 0 -7 Q 18 -6 16 2 Q 8 6 -16 2 Z" fill="#ffffff"/>
    <!-- Spout / Wick tip -->
    <path d="M 0 -7 Q -2 -12 0 -17 Q 2 -12 0 -7 Z" fill="#ffffff"/>
    <!-- Radiating Rays / Petals -->
    <circle cx="0" cy="-18" r="2.5" fill="#fef08a"/>
    <path d="M -7 -4 Q -10 -10 -5 -14" stroke="#ffffff" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M 7 -4 Q 10 -10 5 -14" stroke="#ffffff" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <!-- Small stars / dots -->
    <circle cx="-19" cy="0" r="1.5" fill="#ffffff"/>
    <circle cx="19" cy="0" r="1.5" fill="#ffffff"/>
    <circle cx="0" cy="21" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Right Text: LMS -->
  <text x="214" y="52" fill="#ffffff" font-family="'Segoe UI', Roboto, -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="1">LMS</text>
</svg>
