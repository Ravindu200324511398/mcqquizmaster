# Server Port
server.port=8080

# Database Configuration (MySQL)
# Default MySQL port is 3306. Change username and password if your MySQL setup differs.
spring.datasource.url=jdbc:mysql://localhost:3306/online_quiz_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=mysqlQ1W3e5r7
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
# 'update' automatically updates table schema when Java entities change
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Seed data on initial start if needed
spring.jpa.defer-datasource-initialization=true
