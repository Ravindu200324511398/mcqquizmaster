<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14" />
      <stop offset="50%" stop-color="#121026" />
      <stop offset="100%" stop-color="#07060f" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Subtle Mesh Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>

    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#07060f" stop-opacity="0" />
    </radialGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8b5cf6" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" fill="url(#bgGrad)" rx="20" />
  <rect width="1200" height="320" fill="url(#grid)" rx="20" />
  <rect width="1200" height="320" fill="url(#spotlight)" rx="20" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#primaryGlow)" />

  <!-- Outer Glass Border -->
  <rect x="1" y="1" width="1198" height="318" rx="19" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />

  <!-- Decorative Floating Pills / Orbs -->
  <circle cx="150" cy="80" r="120" fill="#6366f1" opacity="0.08" filter="blur(40px)" />
  <circle cx="1050" cy="220" r="140" fill="#f59e0b" opacity="0.06" filter="blur(50px)" />

  <!-- Brand Symbol / Emblem Graphic -->
  <g transform="translate(600, 100)">
    <!-- Shield / Hexagon Shape -->
    <path d="M 0 -45 L 38 -20 L 38 25 L 0 50 L -38 25 L -38 -20 Z" fill="rgba(139, 92, 246, 0.15)" stroke="url(#primaryGlow)" stroke-width="2.5" />
    
    <!-- Central Brain / Spark Graphic -->
    <circle cx="0" cy="2" r="18" fill="url(#primaryGlow)" opacity="0.9" />
    <path d="M -8 -4 L 8 4 M -8 8 L 8 -8 M 0 -10 L 0 14" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Typography Content -->
  <!-- Main Title -->
  <text x="600" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="4" text-anchor="middle" filter="url(#shadow)">
    QUIZMASTER
  </text>

  <!-- Tagline Subtitle -->
  <text x="600" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="16" font-weight="600" fill="#c4b5fd" letter-spacing="2" text-anchor="middle">
    NEXT-GENERATION ACADEMIC ASSESSMENT &amp; EXAMINATION PLATFORM
  </text>

  <!-- University Course Metadata Pill -->
  <g transform="translate(600, 268)">
    <rect x="-260" y="-14" width="520" height="28" rx="14" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'monospace', sans-serif" font-size="11" font-weight="500" fill="#94a3b8" letter-spacing="1.5" text-anchor="middle">
      EC4307 WEB APPLICATION DEVELOPMENT • 3NF ARCHITECTURE • 30/30 MARKS
    </text>
  </g>
</svg>
